{% extends "base.html" %}{% block content %}<h2>إدارة العلامات</h2><form method="post" class="inlineform">
<label>الطالب<select name="student_id">{% for s in students %}<option value="{{s.id}}">{{s.student_no}} - {{s.name}}</option>{% endfor %}</select></label>
<label>المقرر<select name="course_id">{% for c in courses %}<option value="{{c.id}}">{{c.code}} - {{c.name}}</option>{% endfor %}</select></label>
<label>العلامة<input type="number" min="0" max="100" step="0.5" name="grade" required></label><button>حفظ العلامة</button></form>
<table><tr><th>الطالب</th><th>المقرر</th><th>العلامة</th></tr>
{% for r in rows %}<tr><td>{{r.student}}</td><td>{{r.course}}</td><td>{{r.grade}}</td></tr>{% else %}<tr><td colspan="3">لا توجد علامات</td></tr>{% endfor %}</table>{% endblock %}
