<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title or "نظام إدارة الجامعة" }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><header><h1>نظام إدارة الجامعة الإلكتروني</h1>
{% if session.get('username') %}<nav><a href="{{ url_for('dashboard') }}">الرئيسية</a>
<a href="{{ url_for('students') }}">الطلاب</a><a href="{{ url_for('teachers') }}">المدرسون</a>
<a href="{{ url_for('departments') }}">الأقسام</a><a href="{{ url_for('courses') }}">المقررات</a>
<a href="{{ url_for('enrollments') }}">التسجيلات</a><a href="{{ url_for('grades') }}">العلامات</a>
<a href="{{ url_for('logout') }}">خروج</a></nav>{% endif %}</header>
<main>{% with messages=get_flashed_messages() %}{% for m in messages %}<p class="notice">{{m}}</p>{% endfor %}{% endwith %}
{% block content %}{% endblock %}</main></body></html>
